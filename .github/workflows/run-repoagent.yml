name: Use RepoAgent Action

on:
  workflow_dispatch:
    branches:
      - test-action
  push:
    branches:
      - test-action
      
permissions:
  contents: write  # Enable write access to push changes
  
jobs:
  use-repoagent:
    runs-on: ubuntu-latest

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and run RepoAgent Docker image
        run: |
          docker pull ghcr.io/umpire2018/setup-repoagent:main
          docker run --rm \
            -e OPENAI_BASE_URL=${{ secrets.OPENAI_BASE_URL }} \
            -e OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} \
            -v "${{ github.workspace }}:/workspace" \
            ghcr.io/umpire2018/setup-repoagent:main
